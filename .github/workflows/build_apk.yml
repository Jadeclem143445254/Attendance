name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Repair Android Gradle Project
        run: flutter create --platforms=android --project-name=attendance .

      - name: Upgrade Kotlin Version
        run: |
          find android/ -type f \( -name "build.gradle" -o -name "settings.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/1\.7\.1/1.9.22/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "settings.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/1\.8\.[0-9]*/1.9.22/g' {} +

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
