name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Clean & Rebuild Android Framework
        run: |
          rm -rf android
          flutter create --platforms=android --project-name=attendance .

      - name: Force Upgrade Kotlin Version
        run: |
          python3 -c "
          import os
          for root, _, files in os.walk('android'):
              for file in files:
                  if file.endswith(('.gradle', '.gradle.kts')):
                      p = os.path.join(root, file)
                      with open(p, 'r') as f:
                          s = f.read()
                      s = s.replace('1.7.1', '1.9.22').replace('1.8.0', '1.9.22').replace('1.8.10', '1.9.22').replace('1.8.20', '1.9.22')
                      with open(p, 'w') as f:
                          f.write(s)
          "

      - name: Add Camera & Location Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMS="<uses-permission android:name=\"android.permission.INTERNET\"/>\n<uses-permission android:name=\"android.permission.CAMERA\"/>\n<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>"
          sed -i "/<manifest/a $PERMS" "$MANIFEST"

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
