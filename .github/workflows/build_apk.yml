name: Build SVTI Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
  uses: actions/setup-java@v4
  with:
    distribution: 'temurin'
    java-version: '21'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Upgrade Android Gradle files to declarative format
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name svti_mobile
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
          )
          if "ACCESS_FINE_LOCATION" not in content:
              content = content.replace("<application", perms + "    <application", 1)
          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svti-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
